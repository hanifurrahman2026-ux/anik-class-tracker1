<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <input type="file" accept=".json,application/json" id="import-file" hidden>
<script>
'use strict';
const LEGACY_KEY='classpulse.homework.v1';
const INDEX_KEY='anik.class.tracker.batches.v3', BATCH_PREFIX='anik.class.tracker.batch.v3.';
const DEFAULT_TOTAL=35,MAX_TOTAL=500,MAX_BATCHES=100;
const freshSession=n=>({number:n,status:'planned',date:'',topic:'',hwTitle:'',assigned:true,roster:[],checks:{},attendance:{}});
const blank=(count=DEFAULT_TOTAL,title='আমার কোর্স')=>({version:1,courseName:title,students:[],sessions:Array.from({length:count},(_,i)=>freshSession(i+1))});
function valid(x){return x&&x.version===1&&typeof x.courseName==='string'&&Array.isArray(x.students)&&Array.isArray(x.sessions)&&x.sessions.length>=1&&x.sessions.length<=MAX_TOTAL&&x.sessions.every((s,i)=>s&&s.number===i+1&&['planned','active','finalized'].includes(s.status))&&x.students.every(s=>s&&typeof s.id==='string'&&typeof s.name==='string')}
function normalize(x){const ids=new Set(x.students.map(s=>s.id));return {...x,students:x.students.map(s=>({id:s.id,name:String(s.name).slice(0,140),roll:String(s.roll||'').slice(0,70)})),sessions:x.sessions.map(s=>({...s,date:String(s.date||''),topic:String(s.topic||''),hwTitle:String(s.hwTitle||''),assigned:s.assigned!==false,roster:(Array.isArray(s.roster)?s.roster:[]).filter(id=>ids.has(id)),checks:Object.fromEntries(Object.entries(s.checks||{}).filter(([k,v])=>ids.has(k)&&['submitted','missed'].includes(v))),attendance:Object.fromEntries(Object.entries(s.attendance||{}).filter(([k,v])=>ids.has(k)&&['ontime','late','absent'].includes(v)))}))}}
function newId(){return 'batch-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
const batchKey=id=>BATCH_PREFIX+id;
const colors=['#7564f7','#14af92','#2985e7','#e39a33','#e477a4','#677aee'];
function makeBatch(name='আমার প্রথম ব্যাচ',level='General',color=0){return {id:newId(),name:String(name).trim().slice(0,90),level:String(level).trim().slice(0,55),color:colors[color%colors.length],createdAt:new Date().toISOString()}}
function usableBatchMeta(x){return x&&typeof x.id==='string'&&/^batch-[a-z0-9-]+$/.test(x.id)&&typeof x.name==='string'&&x.name.trim()&&x.name.length<=90&&typeof x.level==='string'&&x.level.length<=55}
function boot(){
 try{
  const raw=localStorage.getItem(INDEX_KEY);
  if(raw){const a=JSON.parse(raw);if(!a||a.version!==3||!Array.isArray(a.batches)||!a.batches.length||!a.batches.every(usableBatchMeta))throw Error('invalid index');
   const existing=a.batches.filter(b=>{try{return valid(JSON.parse(localStorage.getItem(batchKey(b.id))))}catch(e){return false}});
   if(!existing.length)throw Error('missing all batch data');
   return {index:{version:3,batches:existing,activeId:existing.some(b=>b.id===a.activeId)?a.activeId:existing[0].id},failed:false};
  }
  const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');
  const previous=valid(old)?normalize(old):null;
  const first=makeBatch(previous&&previous.courseName!=='আমার কোর্স'?previous.courseName:'আমার প্রথম ব্যাচ', 'Batch 01');
  const data=previous||blank();
  localStorage.setItem(batchKey(first.id),JSON.stringify(data));
  const index={version:3,batches:[first],activeId:first.id};
  localStorage.setItem(INDEX_KEY,JSON.stringify(index));
  return {index,failed:false};
 }catch(e){return {index:{version:3,batches:[],activeId:null},failed:true};}
}
const bootResult=boot();
let index=bootResult.index,storageFailed=bootResult.failed;
function loadBatch(id){try{let x=JSON.parse(localStorage.getItem(batchKey(id)));return valid(x)?normalize(x):null}catch(e){return null}}
let state=loadBatch(index.activeId)||blank();
const currentBatch=()=>index.batches.find(x=>x.id===index.activeId)||null;
const classTotal=()=>state.sessions.length;
let view='batches',selectedClass=1,selectedStudent=null,studentQuery='',classFilter='all',reportFilter='all',modal=null,modalTab='bulk',toastTimer=0,editBatchId=null;
function save(){
 if(storageFailed){toast('স্টোরেজ চালু হয়নি। পুরোনো ডেটা অক্ষত রাখতে অ্যাপ কিছু সংরক্ষণ করছে না।');return false}
 try{localStorage.setItem(batchKey(index.activeId),JSON.stringify(state));return true}catch(e){toast('ডেটা সংরক্ষণ করা যায়নি। স্টোরেজ পূর্ণ বা ব্লক করা হয়েছে।');return false}
}
function saveIndex(){try{localStorage.setItem(INDEX_KEY,JSON.stringify(index));return true}catch(e){toast('ব্যাচের তালিকা সংরক্ষণ করা যায়নি');return false}}
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>{let d=new Date(),p=n=>('0'+n).slice(-2);return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const fmtDate=s=>{if(!s)return 'তারিখ যোগ হয়নি';const [y,m,d]=s.split('-');return `${d||''}/${m||''}/${y||''}`};
const uid=()=> (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);
const pct=(a,b)=>b?Math.round(100*a/b):0;
function sessionStats(s){let a=0,m=0;for(let id of s.roster){if(s.checks[id]==='submitted')a++;else if(s.checks[id]==='missed')m++}return {submitted:a,missed:m,pending:s.roster.length-a-m,total:s.roster.length,rate:pct(a,a+m)}}
function attendanceStats(s){let ontime=0,late=0,absent=0;for(const id of s.roster){const x=(s.attendance||{})[id];if(x==='ontime')ontime++;else if(x==='late')late++;else if(x==='absent')absent++}const total=ontime+late+absent;return {ontime,late,absent,present:ontime+late,recorded:total,pending:s.roster.length-total,total:s.roster.length,rate:pct(ontime+late,total),punctuality:pct(ontime,total)}}
function studentStats(id){let submitted=0,missed=0,activePending=0,ontime=0,late=0,absent=0;
 for(let s of state.sessions){if(!s.roster.includes(id))continue;
   if(s.assigned){if(s.status==='finalized'){if(s.checks[id]==='submitted')submitted++;else if(s.checks[id]==='missed')missed++}else if(s.status==='active'&&!s.checks[id])activePending++}
   if(s.status==='finalized'){const a=(s.attendance||{})[id];if(a==='ontime')ontime++;else if(a==='late')late++;else if(a==='absent')absent++}
 }
 const attendanceTotal=ontime+late+absent;return {submitted,missed,activePending,rate:pct(submitted,submitted+missed),total:submitted+missed,ontime,late,absent,present:ontime+late,attendanceTotal,attendanceRate:pct(ontime+late,attendanceTotal),punctuality:pct(ontime,attendanceTotal)};
}
function overview(){const done=state.sessions.filter(s=>s.status==='finalized'),homeworkDone=done.filter(s=>s.assigned);let sub=0,miss=0,ontime=0,late=0,absent=0;done.forEach(s=>{let a=attendanceStats(s);ontime+=a.ontime;late+=a.late;absent+=a.absent});homeworkDone.forEach(s=>{let n=sessionStats(s);sub+=n.submitted;miss+=n.missed});const attendanceTotal=ontime+late+absent;return {students:state.students.length,done:done.length,homeworkDone:homeworkDone.length,submitted:sub,missed:miss,rate:pct(sub,sub+miss),ontime,late,absent,attendanceTotal,attendanceRate:pct(ontime+late,attendanceTotal),punctuality:pct(ontime,attendanceTotal)}}
function afterChange(){save();render()}
function nav(v){view=v;modal=null;studentQuery='';render();window.scrollTo(0,0)}
function gotoClass(n){if(!Number.isInteger(n)||n<1||n>classTotal())return;selectedClass=n;nav('class')}
function statusTag(s){if(s.status==='planned')return '<span class="status">শুরু হয়নি</span>';if(s.status==='active')return '<span class="status active">চলমান</span>';if(!s.assigned)return '<span class="status nohw">কাজ ছিল না</span>';return '<span class="status done">সম্পন্ন</span>'}
function avatar(name){const parts=(name||'?').trim().split(/\s+/);return esc(parts.length>1?parts[0][0]+parts[parts.length-1][0]:(parts[0]||'?').slice(0,2)).toUpperCase()}
function progressBar(a,b){return `<div class="track"><div class="fill" style="width:${pct(a,b)}%"></div></div>`}
function rateTag(n,has){if(!has)return '<span class="status">—</span>';return `<span class="rate ${n<50?'low':n<75?'mid':''}">${n}%</span>`}
function nextClass(){return state.sessions.find(s=>s.status==='active')||state.sessions.find(s=>s.status==='planned')||state.sessions[classTotal()-1]}

function createOrEditBatch(){let n=el('batch-name')?.value.trim(),level=el('batch-level')?.value.trim();if(!n||!level){toast('ব্যাচের নাম ও লেভেল লিখুন');return}if(modal==='batchedit'){let b=index.batches.find(x=>x.id===editBatchId);if(!b)return;const oldName=b.name;b.name=n.slice(0,90);b.level=level.slice(0,55);if(b.id===index.activeId && (state.courseName===oldName||state.courseName==='আমার কোর্স')){state.courseName=b.name;save()}else if(b.id!==index.activeId){const d=loadBatch(b.id);if(d&&(d.courseName===oldName||d.courseName==='আমার কোর্স')){d.courseName=b.name;localStorage.setItem(batchKey(b.id),JSON.stringify(d))}}saveIndex();modal=null;afterChange();toast('ব্যাচের নাম পরিবর্তন হয়েছে');return}
 let v=el('batch-total')?.value.trim();let total=Number(v);if(!/^\d+$/.test(v)||!Number.isSafeInteger(total)||total<1||total>MAX_TOTAL){toast('১ থেকে ৫০০ এর মধ্যে ক্লাস সংখ্যা দিন');return}if(index.batches.length>=MAX_BATCHES){toast('সর্বোচ্চ ১০০টি ব্যাচ তৈরি করা যাবে');return}
 let b=makeBatch(n,level,index.batches.length);let content=blank(total,n);try{localStorage.setItem(batchKey(b.id),JSON.stringify(content))}catch(e){toast('নতুন ব্যাচের তথ্য সংরক্ষণ করা যায়নি');return}const formerId=index.activeId;index.batches.push(b);index.activeId=b.id;if(!saveIndex()){index.batches.pop();index.activeId=formerId;localStorage.removeItem(batchKey(b.id));return}state=content;selectedClass=1;modal=null;view='dashboard';afterChange();toast(`'${n}' ব্যাচ তৈরি হয়েছে`)
}

  for(const item of x.batches){const b=makeBatch(item.meta.name,item.meta.level,index.batches.length);try{localStorage.setItem(batchKey(b.id),JSON.stringify(normalize(item.data)))}catch(e){toast('স্টোরেজ পূর্ণ; কিছু ব্যাচ ইমপোর্ট হয়নি');break}index.batches.push(b)}saveIndex();modal=null;view='batches';render();toast('একাধিক ব্যাচ ইমপোর্ট করা হয়েছে');return;
 }
 const data=x?.format==='anik-class-tracker-batch'?x.data:x;const meta=x?.format==='anik-class-tracker-batch'?x.meta:null;
 if(!valid(data)){toast('এই ফাইলে উপযুক্ত ব্যাচের ডেটা নেই');return}
 if(index.batches.length>=MAX_BATCHES){toast('সর্বোচ্চ ১০০টি ব্যাচ রাখা যাবে');return}
 const title=meta?.name||data.courseName||'ইমপোর্ট করা ব্যাচ';
 if(!confirm(`'${title}' ব্যাচটি নতুন, আলাদা ব্যাচ হিসেবে যোগ করবেন? কোনো বর্তমান ডেটা পরিবর্তন হবে না।`))return;
 const b=makeBatch(title,meta?.level||'Imported',index.batches.length);try{localStorage.setItem(batchKey(b.id),JSON.stringify(normalize(data)))}catch(e){toast('স্টোরেজে ফাইলটি সংরক্ষণ করা যায়নি');return}index.batches.push(b);saveIndex();view='batches';render();toast('ব্যাচটি আলাদাভাবে ইমপোর্ট হয়েছে');

utton></div><div class="feature-row"><div><h3>আলাদা ব্যাচ ইমপোর্ট করুন</h3><p>পুরোনো বা নতুন JSON ফাইল ইমপোর্ট করলে নতুন ব্যাচ তৈরি হবে।</p></div><button class="button small" data-action="import">⇧ ইমপোর্ট</button></div><div class="feature-row"><div><h3>সব ব্যাচের ব্যাকআপ</h3><p>আপনার সব ব্যাচের ডেটা এক JSON ফাইলে ডাউনলোড করুন।</p></div><button class="button small" data-action="backup-all">⇩ সব ব্যাচ</button></div><div class="feature-row"><div><h3>CSV রিপোর্ট</h3><p>Excel / Google Sheets-এও খোলা যাবে।</p></div><button class="button small" data-action="csv">⇩ CSV</button></div></section></div>

function renderDetailModal(){const s=state.students.find(x=>x.id===selectedStudent);if(!s)return '';const st=studentStats(s.id);

document.addEventListener('change',e=>{const b=e.target;if(b.id==='import-file'){importJSON(b.files[0]);b.value='';return}if(b.dataset.action==='toggle-hw'){const s=state.sessions[selectedClass-1];if(s.status==='active'){s.assigned=b.checked;afterChange()}return}if(b.dataset.field){let s=state.sessions[selectedClass-1];if(s.status==='planned')return;let f=b.dataset.field;if(['date','topic','hwTitle'].includes(f)){s[f]=String(b.value).slice(0,160);save()}}});
document.addEventListener('input',e=>{if(e.target.id==='student-search'){let p=e.target.selectionStart,q=e.target.value;studentQuery=q;render();let a=el('student-search');if(a){a.focus();a.setSelectionRange(p,p)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}if(e.key==='Enter'&&e.target.matches('.session-card')){e.target.click()}});
render();
</script>
</body>
</html>
